name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing in these jobs needs to write to the repo.
permissions:
  contents: read

# Cancel superseded PR runs, but never cancel a main run: it may be deploying.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so the build can run. This job never talks to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:58321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          # On PRs this is a merge commit; depth 2 brings in main (HEAD^1) to compare against.
          fetch-depth: 2
      # Production only applies migrations it hasn't seen, by timestamp. An edited
      # migration would never reach it, and an older timestamp than main's newest
      # makes `supabase db push` refuse to deploy.
      - name: Migrations are append-only and newer than main
        if: github.event_name == 'pull_request'
        run: |
          edited=$(git diff --name-only --diff-filter=MDR HEAD^1 HEAD -- supabase/migrations)
          if [ -n "$edited" ]; then
            echo "::error::Migrations already on main can't be edited, renamed, or deleted. Add a new one instead: $edited"
            exit 1
          fi
          latest=$(git ls-tree --name-only HEAD^1 supabase/migrations/ | xargs -n1 basename | cut -d_ -f1 | sort | tail -1)
          for f in $(git diff --name-only --diff-filter=A HEAD^1 HEAD -- supabase/migrations); do
            version=$(basename "$f" | cut -d_ -f1)
            if [ "$version" -le "$latest" ]; then
              echo "::error file=$f::Timestamp is older than main's newest migration ($latest). Recreate it with \`supabase migration new\`."
              exit 1
            fi
          done
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Compare the entire push, or the PR merge tree against its base.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Detect database test changes
        id: database
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-database.mjs tests
      - uses: supabase/setup-cli@v3
        with:
          # Pinned so a new CLI release can't break CI on its own. Bump it
          # together with your local CLI (`supabase --version`).
          version: 2.121.0
      - run: npm ci

      - name: Start Supabase (only the services the app uses)
        run: supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor
      - name: Database tests (RLS)
        if: steps.database.outputs.needed == 'true'
        run: npm run test:db
      - name: Generated types match the migrations
        if: steps.database.outputs.needed == 'true'
        run: |
          npm run db:types
          git diff --exit-code lib/supabase/database.types.ts \
            || (echo "Run npm run db:types and commit lib/supabase/database.types.ts" && exit 1)

      - run: npm run env:local
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-db:
    # Vercel's Deployment Checks wait on this exact name before the app goes
    # live, so the schema is always in place first. Rename it in both places.
    name: Deploy migrations to production
    # Always report a real failure if prerequisites fail, rather than a skipped
    # check that a deployment gate could accept. PRs never enter this job.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [checks, e2e]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in this environment, which only main can use, so a PR branch
    # can't read the production password.
    environment: production
    concurrency:
      group: deploy-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Require passing tests
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$CHECKS_RESULT" != success ] || [ "$E2E_RESULT" != success ]; then
            echo "::error::Required CI jobs did not pass; production deployment is blocked."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check migrations against the last successful deployment
        id: database
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-database.mjs deploy
      - uses: supabase/setup-cli@v3
        if: steps.database.outputs.needed == 'true'
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        if: steps.database.outputs.needed == 'true'
      - run: supabase db push
        if: steps.database.outputs.needed == 'true'
      - name: No migrations needed
        if: steps.database.outputs.needed == 'false'
        run: echo "Database deployment inputs match a successful production deployment."
